<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="徐摆摆Ryan的个人博客。写下自己想记住的事。">
  <meta name="theme-color" content="#1b2635">
  <title>Ryan blog</title>
  <link rel="icon" href="./assets/icon.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/appearance.js" defer></script>
  <script src="./assets/public.js" defer></script>
  <script src="./assets/ambient.js" defer></script>
</head>
<body id="top">
  <div class="ambient-background" aria-hidden="true">
    <span class="ambient-glow"></span>
    <canvas class="ambient-canvas"></canvas>
  </div>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./index.html" aria-label="徐摆摆Ryan 首页">
        <img class="brand-mark" src="./assets/avatar.jpg" alt="" width="44" height="44">
        <span>徐摆摆Ryan</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#posts">文章</a>
        <button class="theme-toggle" type="button" aria-label="切换深色模式" hidden>
          <span class="theme-icon" aria-hidden="true"></span>
        </button>
      </nav>
    </div>
  </header>

  <aside class="theme-suggestion shell" id="night-mode-suggestion" aria-live="polite" hidden>
    <p>天色晚了，要切换到夜间模式吗？</p>
    <div class="theme-suggestion-actions">
      <button class="button button-small button-dark" type="button" id="use-night-mode">切换夜间模式</button>
      <button class="text-link" type="button" id="keep-day-mode">保持日间</button>
    </div>
  </aside>

  <main class="shell" id="main" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow"><span class="ink-dot" aria-hidden="true"></span> 一个留给自己的地方</p>
        <h1 id="hero-title">欢迎来到<br>徐摆摆的博客</h1>
        <p class="hero-intro">想到什么，就写一篇。</p>
      </div>
    </section>

    <section class="posts-section" id="posts" aria-labelledby="posts-title">
      <div class="section-heading">
        <div class="section-title-group">
          <p class="eyebrow">写过的与想写的</p>
          <h2 id="posts-title" tabindex="-1">文章<span class="post-count" id="post-count"></span></h2>
        </div>
      </div>
      <div class="filters" id="filters" role="group" aria-label="按分类筛选文章" hidden></div>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="post-grid" id="post-grid"></div>
      <section class="article-view" id="article-view" aria-live="polite" hidden></section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <a class="brand" href="./index.html">
        <img class="brand-mark" src="./assets/avatar.jpg" alt="" width="36" height="36">
        <span>徐摆摆Ryan</span>
      </a>
      <a class="text-link" href="#top">回到顶部 <span aria-hidden="true">↑</span></a>
    </div>
  </footer>
</body>
</html>
